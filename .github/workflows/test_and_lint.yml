name: Test and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # opencv-python needs libGL at import time.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kinematics,dev]"
      - name: Show resolved versions
        run: python -m pip list
      # Blocking: syntax errors and undefined names only. The full flake8
      # config reports ~900 style issues that predate CI.
      - name: flake8 (errors only)
        run: flake8 --select=E9,F63,F7,F82 --show-source src tests
      - name: Run tests
        run: coverage run -m unittest discover
      # Informational until coverage and docstrings reach the thresholds
      # in pyproject.toml.
      - name: Coverage report
        run: coverage report --fail-under=0
      - name: Docstring coverage
        run: interrogate src || true
