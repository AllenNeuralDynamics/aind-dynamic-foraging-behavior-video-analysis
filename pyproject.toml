[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-dynamic-foraging-behavior-video-analysis"
description = "Generated from aind-library-template"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
readme = "README.md"
dynamic = ["version"]

# Core is what video_alignment and tongue_lickometer_utils need, so
# consumers that only align timebases stay light. Everything else
# (kinematics, ephys, NWB) is in the `kinematics` extra; video quality QC
# is in the `video-qc` extra, video clips in the `video-clips` extra.
dependencies = [
    'numpy',
    'pandas'
]

[project.optional-dependencies]
kinematics = [
    'aind-dynamic-foraging-basic-analysis',
    'aind-dynamic-foraging-data-utils',
    'matplotlib',
    'moviepy',
    'opencv-python',
    'pyarrow',
    'pynwb',
    'python-dateutil',
    'requests',
    'scipy',
    'seaborn'
]
# video_quality_qc and video_quality_report. aind-video-utils is pinned:
# its exposure statistics define our metrics. Its probe() calls the
# system ffprobe, so ffmpeg must be on PATH.
video-qc = [
    'aind-video-utils==0.7.0',
    'av',
    'matplotlib',
    'pyarrow'
]
# video_clips: frame-exact seeking through aind-video-utils (same pin as
# video-qc; move both together), k-means frame selection. Needs ffmpeg on
# PATH.
video-clips = [
    'aind-video-utils==0.7.0',
    'scikit-learn'
]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aind_dynamic_foraging_behavior_video_analysis.__version__"}

[tool.black]
line-length = 79
target_version = ['py311']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_dynamic_foraging_behavior_video_analysis", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
